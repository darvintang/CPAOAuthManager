# Created by Darvin.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64, ext: so}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, ext: so}
          - {runner: macos-15-intel, goos: darwin, goarch: amd64, ext: dylib}
          - {runner: macos-15, goos: darwin, goarch: arm64, ext: dylib}
          - {runner: windows-2022, goos: windows, goarch: amd64, ext: dll}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install ZIP on Windows
        if: runner.os == 'Windows'
        run: choco install zip --yes --no-progress
      # Build on matching native runners because the plugin exports a C ABI.
      - name: Test and build
        shell: bash
        run: |
          node scripts/test-management-auth.cjs
          version="${GITHUB_REF_NAME#v}"
          # Surface build failures in public annotations as logs require sign-in.
          if ! bash scripts/build-release.sh "$version" > build.log 2>&1; then
            cat build.log
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 25 build.log)
            exit 1
          fi
          cat build.log
          unzip -o "dist/cpa-oauth-manager_${version}_${GOOS}_${GOARCH}.zip" -d dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpa-oauth-manager-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cpa-oauth-manager.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cpa-oauth-manager-*
          path: staging
      - name: Package release assets
        run: bash scripts/package-release-assets.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          凭证管理：统一管理凭证优先级、调度权重与并发上限。

          - 展示全部凭证，修改暂存于页面，点击“保存全部修改”后提交。
          - 满并发时自动选择其他可用凭证，高优先级满额后可切换到低优先级。
          - 自动读取管理中心登录信息，支持简体中文、繁體中文、English 和 Русский。
          - 白色页面布局、优先级与权重说明气泡，静默刷新保留输入和焦点。
          - 发布前已通过单元测试、竞态检测、页面交互测试及双凭证真实模型并发验证。

          宿主不提供跨凭证文件与插件配置的事务；部分保存失败时保留待提交修改并提示重试。
          所有可用凭证均满额时返回 503，当前宿主可能将错误码包装为 internal_server_error。

          插件 ID：`cpa-oauth-manager`。
          提供 Linux amd64/arm64、macOS amd64/arm64、Windows amd64 安装包、registry.json 插件注册表及 SHA-256 校验文件。
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/registry.json dist/checksums.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --title "凭证管理 $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            # Remove renamed plugin archives only after every replacement has uploaded.
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
            while IFS= read -r asset; do
              case "$asset" in
                cpa-*_${GITHUB_REF_NAME#v}_*.zip)
                  if [[ ! -f "dist/$asset" ]]; then
                    gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
                  fi
                  ;;
              esac
            done < "$RUNNER_TEMP/release-assets.txt"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/registry.json dist/checksums.txt \
              --verify-tag --title "凭证管理 $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Verify that the published asset set exactly matches the new packages.
          diff <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort) \
            <(cd dist && printf '%s\n' *.zip registry.json checksums.txt | sort)
