# Created by Darvin.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64, ext: so}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, ext: so}
          - {runner: macos-15-intel, goos: darwin, goarch: amd64, ext: dylib}
          - {runner: macos-15, goos: darwin, goarch: arm64, ext: dylib}
          - {runner: windows-2022, goos: windows, goarch: amd64, ext: dll}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install ZIP on Windows
        if: runner.os == 'Windows'
        run: choco install zip --yes --no-progress
      # Build on matching native runners because the plugin exports a C ABI.
      - name: Test and build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Surface build failures in public annotations as logs require sign-in.
          if ! bash scripts/build-release.sh "$version" > build.log 2>&1; then
            cat build.log
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 25 build.log)
            exit 1
          fi
          cat build.log
          unzip -o "dist/cpa-oauth-concurrency_${version}_${GOOS}_${GOARCH}.zip" -d dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpa-oauth-concurrency-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cpa-oauth-concurrency.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cpa-oauth-concurrency-*
          path: staging
      - name: Package release assets
        run: bash scripts/package-release-assets.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          凭证并发管理：按凭证限制并发请求，支持缓存亲和、共享并发控制和实时用量查看。

          插件 ID：`cpa-oauth-concurrency`。
          提供 Linux amd64/arm64、macOS amd64/arm64、Windows amd64 安装包及 SHA-256 校验文件。
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/checksums.txt \
            --verify-tag --title "凭证并发管理 $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
